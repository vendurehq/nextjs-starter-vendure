name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: github.event_name == 'pull_request'
        run: npm run upgrade:validate -- --base origin/${{ github.base_ref }}
      - if: github.event_name != 'pull_request'
        run: npm run upgrade:validate
      - run: npm test
      - run: npm run lint
      - run: npm run check-types
      - run: npm run build
        env:
          VENDURE_SHOP_API_URL: https://readonlydemo.vendure.io/shop-api
